<body><pre id=o>running</pre><script>
const p=location.search.slice(1);const f=document.createElement('iframe');f.style.cssText='width:390px;height:800px;border:0';f.src=p;
f.onload=()=>{setTimeout(()=>{const d=f.contentDocument.documentElement;let w=[];f.contentDocument.querySelectorAll('body *').forEach(e=>{const r=e.getBoundingClientRect();if(r.right>391&&getComputedStyle(e).position!='fixed')w.push(e.tagName+'.'+e.className+':'+Math.round(r.right))});document.getElementById('o').textContent="RES "+p+" scroll="+d.scrollWidth+" wide="+w.slice(0,4).join(' | ')},500)};
document.body.appendChild(f);</script></body>
